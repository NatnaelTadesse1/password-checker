<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecurePass Analyzer</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #141e30, #243b55);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: white;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            width: 350px;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.5);
        }

        h1 {
            margin-bottom: 20px;
        }

        input {
            width: 90%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background-color: #00b894;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #019875;
        }

        .strength-container {
            width: 100%;
            height: 20px;
            background-color: #ccc;
            border-radius: 10px;
            margin-top: 20px;
        }

        #strength-bar {
            height: 100%;
            width: 0%;
            border-radius: 10px;
            transition: 0.5s;
        }

        #result {
            margin-top: 20px;
        }

        #suggestions {
            margin-top: 10px;
            font-size: 14px;
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>SecurePass Analyzer</h1>

        <input type="password" id="password" placeholder="Enter your password">

        <br><br>

        <button onclick="checkPassword()">Check Strength</button>

        <div class="strength-container">
            <div id="strength-bar"></div>
        </div>

        <h2 id="result"></h2>

        <p id="suggestions"></p>

    </div>

    <script>

        function checkPassword() {

            let password = document.getElementById("password").value;

            let strengthBar = document.getElementById("strength-bar");
            let result = document.getElementById("result");
            let suggestions = document.getElementById("suggestions");

            let strength = 0;

            suggestions.innerHTML = "";

            // Length Check
            if (password.length >= 8) {
                strength++;
            } else {
                suggestions.innerHTML += "• Use at least 8 characters.<br>";
            }

            // Uppercase Check
            if (/[A-Z]/.test(password)) {
                strength++;
            } else {
                suggestions.innerHTML += "• Add uppercase letters.<br>";
            }

            // Lowercase Check
            if (/[a-z]/.test(password)) {
                strength++;
            } else {
                suggestions.innerHTML += "• Add lowercase letters.<br>";
            }

            // Number Check
            if (/[0-9]/.test(password)) {
                strength++;
            } else {
                suggestions.innerHTML += "• Add numbers.<br>";
            }

            // Symbol Check
            if (/[\W]/.test(password)) {
                strength++;
            } else {
                suggestions.innerHTML += "• Add special symbols.<br>";
            }

            // Common Passwords
            let commonPasswords = ["123456", "password", "admin", "qwerty"];

            if (commonPasswords.includes(password)) {
                strength = 0;
                suggestions.innerHTML = "• This is a very common password!";
            }

            // Result Output
            if (strength <= 2) {

                result.innerHTML = "Weak Password";
                result.style.color = "red";

                strengthBar.style.width = "33%";
                strengthBar.style.backgroundColor = "red";

            }

            else if (strength <= 4) {

                result.innerHTML = "Medium Password";
                result.style.color = "orange";

                strengthBar.style.width = "66%";
                strengthBar.style.backgroundColor = "orange";

            }

            else {

                result.innerHTML = "Strong Password";
                result.style.color = "lime";

                strengthBar.style.width = "100%";
                strengthBar.style.backgroundColor = "lime";
            }
        }

    </script>

</body>
</html>
